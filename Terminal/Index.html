<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUTH - Order Register Terminal</title>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: #1A1D24;
      --accent: #8A7B6C;
      --accent-light: #C5A880;
      --text-main: #EEEEEE;
      --text-muted: #999999;
      --border-color: #2A2E39;
      --danger: #D32F2F;
      --success: #2E7D32;
      --warning-yellow: #D4A017;
      --warning-bg: #2C2612;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .pos-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--accent-light);
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sales-badge {
      background: #252830;
      border: 1px solid var(--accent-light);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      color: var(--accent-light);
      font-size: 13px;
    }

    .action-btn-sm {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .action-btn-sm:hover {
      border-color: var(--accent-light);
    }

    /* Order Mode Switcher */
    .mode-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 15px;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
    }

    /* Dine-In Tables Bar */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .table-card.active {
      border-color: var(--accent-light);
      box-shadow: 0 0 5px var(--accent-light);
    }

    .table-card.has-unpaid {
      background: var(--warning-bg) !important;
      border-color: var(--warning-yellow) !important;
      color: var(--warning-yellow) !important;
    }

    /* Categories Navigation */
    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
    }

    /* Items Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      min-height: 100px;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-light);
    }

    .item-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .item-price {
      color: var(--accent-light);
      font-weight: 700;
      font-size: 14px;
    }

    /* Cart Sidebar */
    .cart-section {
      width: 380px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .cart-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .cart-item-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .cart-item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .qty-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .checkout-btn:hover {
      background: var(--accent-light);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      border: 1px solid var(--border-color);
      max-height: 90vh;
      overflow-y: auto;
    }

    .options-group {
      margin-bottom: 18px;
    }

    .options-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .opt-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .opt-btn.selected {
      background: var(--accent);
      border-color: var(--accent-light);
    }

    .input-field {
      width: 100%;
      padding: 12px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 15px;
      margin-top: 5px;
    }

    /* History & Report Item Tables */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .history-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .status-completed { background: #1B5E20; color: #E8F5E9; }
    .status-canceled { background: #B71C1C; color: #FFEBEE; }

    /* Single Clean Receipt Layout */
    .receipt-container {
      background: #ffffff;
      color: #000000;
      padding: 6px 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 11px;
      line-height: 1.2;
      width: 100%;
      box-sizing: border-box;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 4px;
    }

    .receipt-header h2 {
      font-size: 13px;
      margin: 0 0 2px 0;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000000;
    }

    .receipt-header h3 {
      font-size: 14px;
      margin: 2px 0;
      font-weight: 700;
      color: #000000;
    }

    .receipt-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #000000;
    }

    .receipt-divider {
      border-top: 1px dashed #000000;
      margin: 4px 0;
    }

    .receipt-table-header {
      display: flex;
      font-weight: 700;
      font-size: 10px;
      padding: 2px 0;
      text-transform: uppercase;
      color: #000000;
    }

    .col-qty { width: 22px; font-weight: 700; }
    .col-item { flex: 1; padding-right: 2px; }
    .col-price { width: 50px; text-align: right; }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      font-size: 10px;
      font-weight: 500;
      color: #000000;
    }

    .item-notes {
      font-size: 9px;
      color: #000000;
      margin-left: 22px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .receipt-total-section {
      margin-top: 4px;
      text-align: right;
    }

    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-top: 2px;
      color: #000000;
    }

    /* Print Formatting Rules */
    @media print {
      @page {
        margin: 0 !important;
        size: 80mm auto !important;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        width: 80mm !important;
        background: #ffffff !important;
        color: #000000 !important;
      }

      body * {
        visibility: hidden !important;
      }

      #receiptModal, #receiptModal *,
      #closingReportModal, #closingReportModal * {
        visibility: visible !important;
      }

      #receiptModal, #closingReportModal {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        height: auto !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .receipt-container {
        padding: 4px 6px 25px 6px !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .modal-content {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
      }

      .modal-actions, .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- POS Main Section -->
    <div class="pos-section">
      <div class="header">
        <div>
          <h1>SOUTH SPECIALTY COFFEE</h1>
          <span style="color: var(--text-muted);" id="order-target-display">Walk-In Order</span>
        </div>
        <div class="nav-actions">
          <div class="sales-badge" id="live-total-sales-display">Total Sales: 0.000 KD</div>
          <button class="action-btn-sm" onclick="openOrderHistory()">Order History</button>
          <button class="action-btn-sm" style="background: var(--accent); color: white;" onclick="openClosingReport()">Closing Report</button>
        </div>
      </div>

      <!-- Mode Selector (Walk-In vs Dine-In) -->
      <div class="mode-tabs">
        <button class="mode-btn active" id="btn-mode-walkin" onclick="switchOrderMode('walkin')">Walk-In (Takeaway)</button>
        <button class="mode-btn" id="btn-mode-dinein" onclick="switchOrderMode('dinein')">Dine-In (20 Tables)</button>
      </div>

      <!-- Dine-In Tables Grid (Hidden by default) -->
      <div class="tables-grid" id="tables-container" style="display: none;"></div>

      <!-- Categories Navigation -->
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('hot', this)">Hot Coffees & Teas</button>
        <button class="cat-btn" onclick="filterCategory('cold', this)">Cold Coffees & Teas</button>
        <button class="cat-btn" onclick="filterCategory('refreshers', this)">Refreshers & Water</button>
        <button class="cat-btn" onclick="filterCategory('sweets', this)">Sweets & Bakery</button>
      </div>

      <!-- Menu Items Grid -->
      <div class="menu-grid" id="menu-grid"></div>
    </div>

    <!-- Sidebar Cart -->
    <div class="cart-section">
      <div class="cart-header">
        <h2 id="cart-title">Walk-In Cart</h2>
        <button class="qty-btn" onclick="clearCart()">✕</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="cart-total">0.000 KD</span>
        </div>
        
        <!-- Dine-in open tab action -->
        <button class="checkout-btn" id="save-tab-btn" style="background: var(--card-bg); border: 1px solid var(--warning-yellow); color: var(--warning-yellow); display: none;" onclick="sendOrderToKitchen()">
          Send to Kitchen (Keep Tab Open)
        </button>

        <!-- Final Payment Action -->
        <button class="checkout-btn" onclick="openPaymentModal()">
          Pay & Close Order
        </button>
      </div>
    </div>
  </div>

  <!-- Customization Modal -->
  <div class="modal" id="customizeModal">
    <div class="modal-content">
      <h3 id="modal-item-title" style="margin-bottom: 15px;">Customize Drink</h3>
      
      <!-- Size Choice -->
      <div class="options-group" id="size-group">
        <label>Cup Size</label
