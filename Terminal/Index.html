<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUTH - Order Register Terminal</title>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: #1A1D24;
      --accent: #8A7B6C;
      --accent-light: #C5A880;
      --text-main: #EEEEEE;
      --text-muted: #999999;
      --border-color: #2A2E39;
      --danger: #D32F2F;
      --success: #2E7D32;
      --warning-yellow: #D4A017;
      --warning-bg: #2C2612;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .pos-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--accent-light);
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sales-badge {
      background: #252830;
      border: 1px solid var(--accent-light);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      color: var(--accent-light);
      font-size: 13px;
    }

    .action-btn-sm {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .action-btn-sm:hover {
      border-color: var(--accent-light);
    }

    /* Order Mode Switcher */
    .mode-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 15px;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
    }

    /* Dine-In Tables Bar */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .table-card.active {
      border-color: var(--accent-light);
      box-shadow: 0 0 5px var(--accent-light);
    }

    .table-card.has-unpaid {
      background: var(--warning-bg) !important;
      border-color: var(--warning-yellow) !important;
      color: var(--warning-yellow) !important;
    }

    /* Categories Navigation */
    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
    }

    /* Items Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      min-height: 100px;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-light);
    }

    .item-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .item-price {
      color: var(--accent-light);
      font-weight: 700;
      font-size: 14px;
    }

    /* Cart Sidebar */
    .cart-section {
      width: 380px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .cart-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .cart-item-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .cart-item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .qty-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .checkout-btn:hover {
      background: var(--accent-light);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      border: 1px solid var(--border-color);
      max-height: 90vh;
      overflow-y: auto;
    }

    .options-group {
      margin-bottom: 18px;
    }

    .options-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .opt-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
