<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUTH - Order Register Terminal</title>
  <style>
    :root {
      --bg-dark: #121418;
      --card-bg: #1A1D24;
      --accent: #8A7B6C;
      --accent-light: #C5A880;
      --text-main: #EEEEEE;
      --text-muted: #999999;
      --border-color: #2A2E39;
      --danger: #D32F2F;
      --success: #2E7D32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .pos-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--accent-light);
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn-sm {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .action-btn-sm:hover {
      border-color: var(--accent-light);
    }

    /* Categories Navigation */
    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
    }

    /* Items Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      min-height: 110px;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-light);
    }

    .item-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .item-price {
      color: var(--accent-light);
      font-weight: 700;
      font-size: 15px;
    }

    /* Cart Sidebar */
    .cart-section {
      width: 380px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .cart-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .cart-item-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .cart-item-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .qty-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
    }

    .payment-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pay-btn {
      flex: 1;
      padding: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .pay-btn.selected {
      background: var(--accent);
      border-color: var(--accent-light);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover {
      background: var(--accent-light);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 540px;
      border: 1px solid var(--border-color);
      max-height: 90vh;
      overflow-y: auto;
    }

    .options-group {
      margin-bottom: 18px;
    }

    .options-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .opt-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .opt-btn.selected {
      background: var(--accent);
      border-color: var(--accent-light);
    }

    /* History & Report Item Tables */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .history-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .status-completed { background: #1B5E20; color: #E8F5E9; }
    .status-canceled { background: #B71C1C; color: #FFEBEE; }

    /* Single Clean Receipt Layout */
    .receipt-container {
      background: #ffffff;
      color: #000000;
      padding: 8px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.25;
      width: 100%;
      box-sizing: border-box;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 6px;
    }

    .receipt-header h2 {
      font-size: 14px;
      margin: 0 0 2px 0;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000000;
    }

    .receipt-header h3 {
      font-size: 15px;
      margin: 2px 0;
      font-weight: 700;
      color: #000000;
    }

    .receipt-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #000000;
    }

    .receipt-divider {
      border-top: 1px dashed #000000;
      margin: 6px 0;
    }

    .receipt-table-header {
      display: flex;
      font-weight: 600;
      font-size: 11px;
      padding: 2px 0;
      text-transform: uppercase;
      color: #000000;
    }

    .col-qty { width: 28px; font-weight: 600; }
    .col-item { flex: 1; padding-right: 4px; }
    .col-price { width: 62px; text-align: right; }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #000000;
    }

    .item-notes {
      font-size: 10px;
      color: #000000;
      margin-left: 28px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .receipt-total-section {
      margin-top: 6px;
      text-align: right;
    }

    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
      color: #000000;
    }

    /* Print Formatting Rules */
    @media print {
      @page {
        margin: 0 !important;
        size: 80mm auto !important;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        width: 80mm !important;
        background: #ffffff !important;
        color: #000000 !important;
      }

      body * {
        visibility: hidden !important;
      }

      #receiptModal, #receiptModal *,
      #closingReportModal, #closingReportModal * {
        visibility: visible !important;
      }

      #receiptModal, #closingReportModal {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        height: auto !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .receipt-container {
        padding: 8px 10px !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .modal-content {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
      }

      .modal-actions, .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- POS Main Section -->
    <div class="pos-section">
      <div class="header">
        <div>
          <h1>SOUTH SPECIALTY COFFEE</h1>
          <span style="color: var(--text-muted);" id="order-number-display">Order #1</span>
        </div>
        <div class="nav-actions">
          <button class="action-btn-sm" onclick="openOrderHistory()">Order History</button>
          <button class="action-btn-sm" style="background: var(--accent); color: white;" onclick="openClosingReport()">Closing Report</button>
        </div>
      </div>

      <!-- Categories Navigation -->
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('hot', this)">Hot Coffees & Teas</button>
        <button class="cat-btn" onclick="filterCategory('cold', this)">Cold Coffees & Teas</button>
        <button class="cat-btn" onclick="filterCategory('refreshers', this)">Refreshers & Water</button>
        <button class="cat-btn" onclick="filterCategory('sweets', this)">Sweets & Bakery</button>
      </div>

      <!-- Menu Items Grid -->
      <div class="menu-grid" id="menu-grid"></div>
    </div>

    <!-- Sidebar Cart -->
    <div class="cart-section">
      <div class="cart-header">
        <h2>Current Order</h2>
        <button class="qty-btn" onclick="clearCart()">✕</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Payment Method</label>
        <div class="payment-toggle">
          <button class="pay-btn selected" id="pay-knet" onclick="selectPayment('K-NET', this)">K-NET</button>
          <button class="pay-btn" id="pay-cash" onclick="selectPayment('Cash', this)">Cash</button>
        </div>
        <div class="total-row">
          <span>Total</span>
          <span id="cart-total">0.000 KD</span>
        </div>
        <button class="checkout-btn" onclick="processCheckout()">Checkout & Print</button>
      </div>
    </div>
  </div>

  <!-- Customization Modal -->
  <div class="modal" id="customizeModal">
    <div class="modal-content">
      <h3 id="modal-item-title" style="margin-bottom: 15px;">Customize Drink</h3>
      
      <!-- Size Choice -->
      <div class="options-group" id="size-group">
        <label>Cup Size</label>
        <div class="options-grid">
          <button class="opt-btn selected" onclick="selectOpt(this, 'size', '8 oz')">8 oz (Regular)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'size', '12 oz (+0.250 KD)')">12 oz (+0.250 KD)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'size', '16 oz (+0.500 KD)')">16 oz (+0.500 KD)</button>
        </div>
      </div>

      <!-- Espresso Shots -->
      <div class="options-group" id="shots-group">
        <label>Espresso Shots</label>
        <div class="options-grid">
          <button class="opt-btn" onclick="selectOpt(this, 'shots', 'Single Shot')">Single Shot</button>
          <button class="opt-btn selected" onclick="selectOpt(this, 'shots', 'Double Shot')">Double Shot (Standard)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'shots', 'Extra Shot (+0.250 KD)')">Extra Shot (+0.250 KD)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'shots', 'Decaf')">Decaf</button>
        </div>
      </div>

      <!-- Milk Choice -->
      <div class="options-group" id="milk-group">
        <label>Milk Choice</label>
        <div class="options-grid">
          <button class="opt-btn selected" onclick="selectOpt(this, 'milk', 'Full Fat')">Full Fat</button>
          <button class="opt-btn" onclick="selectOpt(this, 'milk', 'Skimmed')">Skimmed</button>
          <button class="opt-btn" onclick="selectOpt(this, 'milk', 'Lactose Free')">Lactose Free</button>
          <button class="opt-btn" onclick="selectOpt(this, 'milk', 'Almond (+0.250 KD)')">Almond (+0.250 KD)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'milk', 'Oat (+0.250 KD)')">Oat (+0.250 KD)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'milk', 'Coconut (+0.250 KD)')">Coconut (+0.250 KD)</button>
        </div>
      </div>

      <!-- Sweetness Level -->
      <div class="options-group" id="sugar-group">
        <label>Sweetness Level</label>
        <div class="options-grid">
          <button class="opt-btn" onclick="selectOpt(this, 'sugar', 'No Sugar')">None (0%)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'sugar', 'Less Sweet')">Less Sweet (50%)</button>
          <button class="opt-btn selected" onclick="selectOpt(this, 'sugar', 'Normal Sweetness')">Normal (100%)</button>
          <button class="opt-btn" onclick="selectOpt(this, 'sugar', 'Extra Sweet')">Extra Sweet (150%)</button>
        </div>
      </div>

      <!-- Temperature / Ice Level -->
      <div class="options-group" id="temp-group">
        <label>Temperature / Ice Profile</label>
        <div class="options-grid">
          <button class="opt-btn selected" onclick="selectOpt(this, 'temp', 'Standard Temp/Ice')">Standard</button>
          <button class="opt-btn" onclick="selectOpt(this, 'temp', 'Extra Hot / Extra Ice')">Extra Hot / Extra Ice</button>
          <button class="opt-btn" onclick="selectOpt(this, 'temp', 'Warm / Light Ice')">Warm / Light Ice</button>
          <button class="opt-btn" onclick="selectOpt(this, 'temp', 'No Ice')">No Ice</button>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="checkout-btn" style="background: var(--card-bg); border: 1px solid var(--border-color);" onclick="closeModal('customizeModal')">Cancel</button>
        <button class="checkout-btn" onclick="confirmAddToCart()">Add to Order</button>
      </div>
    </div>
  </div>

  <!-- Order History Modal -->
  <div class="modal" id="historyModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>Completed & Canceled Orders</h3>
        <button class="qty-btn" onclick="closeModal('historyModal')">✕</button>
      </div>
      <div class="history-list" id="history-container"></div>
    </div>
  </div>

  <!-- Closing Z-Report Modal -->
  <div class="modal" id="closingReportModal">
    <div class="modal-content" style="background: white; padding: 0;">
      <div class="receipt-container">
        <div class="receipt-header">
          <h2>SOUTH SPECIALTY COFFEE</h2>
          <div class="receipt-divider"></div>
          <h3>DAILY CLOSING REPORT</h3>
        </div>

        <div class="receipt-meta">
          <span class="print-date"></span>
          <span>Z-REPORT</span>
        </div>

        <div class="receipt-divider"></div>
        <div id="report-summary-body"></div>
      </div>

      <div class="modal-actions no-print" style="display: flex; gap: 10px; padding: 15px; background: #1A1D24;">
        <button class="checkout-btn" style="flex: 1;" onclick="triggerSequentialPrint()">Print Closing Report</button>
        <button class="checkout-btn" style="flex: 1; background: var(--danger);" onclick="resetShiftData()">Reset Shift Data</button>
        <button class="checkout-btn" style="background: #333;" onclick="closeModal('closingReportModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Single Receipt Print Modal -->
  <div class="modal" id="receiptModal">
    <div class="modal-content" style="background: white; padding: 0;">
      <div class="receipt-container">
        <div class="receipt-header">
          <h2>SOUTH SPECIALTY COFFEE</h2>
          <div class="receipt-divider"></div>
          <h3 id="receipt-order-id">ORDER #1</h3>
        </div>

        <div class="receipt-meta">
          <span class="print-date"></span>
          <span id="receipt-payment-type">K-NET</span>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-table-header">
          <div class="col-qty">Qty</div>
          <div class="col-item">Item</div>
          <div class="col-price">Price</div>
        </div>

        <div class="receipt-divider"></div>
        <div id="receipt-body"></div>
        <div class="receipt-divider"></div>

        <div class="receipt-total-section">
          <div class="receipt-total-row">
            <span>Sub Total</span>
            <span id="receipt-subtotal">0.000</span>
          </div>
          <div class="receipt-total-row" style="font-size: 14px; font-weight: 700;">
            <span>TOTAL</span>
            <span id="receipt-total">KWD 0.000</span>
          </div>
        </div>
      </div>

      <div class="modal-actions no-print" style="display: flex; gap: 10px; padding: 15px; background: #1A1D24;">
        <button class="checkout-btn" onclick="triggerSequentialPrint()">Print Tickets (x2)</button>
        <button class="checkout-btn" style="background: #333;" onclick="closeReceipt()">Close</button>
      </div>
    </div>
  </div>

      { id: 305, name: "Raspberry Mojito", category: "refreshers", price: 2.000, customizable: false },
      { id: 306, name: "Peach Mojito", category: "refreshers", price: 2.000, customizable: false },
      { id: 307, name: "Watermelon Mojito", category: "refreshers", price: 2.000, customizable: false },
      { id: 308, name: "Still Water", category: "refreshers", price: 1.000, customizable: false },
      { id: 309, name: "Sparkling Water", category: "refreshers", price: 0.750, customizable: false },

      { id: 401, name: "Peanut Butter", category: "sweets", price: 1.500, customizable: false },
      { id: 402, name: "Plain Croissant", category: "sweets", price: 1.500, customizable: false },
      { id: 403, name: "Danish Croissant", category: "sweets", price: 1.750, customizable: false },
      { id: 404, name: "Raspberry Croissant", category: "sweets", price: 1.750, customizable: false },
      { id: 405, name: "Almond Croissant", category: "sweets", price: 1.750, customizable: false },
      { id: 406, name: "Muffin", category: "sweets", price: 1.500, customizable: false },
      { id: 407, name: "Round Éclair", category: "sweets", price: 1.750, customizable: false },
      { id: 408, name: "Kinder Cookie", category: "sweets", price: 1.750, customizable: false },
      { id: 409, name: "Brownie", category: "sweets", price: 1.500, customizable: false }
    ];

    let cart = JSON.parse(localStorage.getItem('south_current_cart') || '[]');
    let currentItemToAdd = null;
    let selectedOptions = { 
      size: '8 oz',
      shots: 'Double Shot',
      milk: 'Full Fat', 
      sugar: 'Normal Sweetness',
      temp: 'Standard Temp/Ice'
    };
    let selectedPayment = localStorage.getItem('south_payment_method') || 'K-NET';
    let orderCounter = parseInt(localStorage.getItem('south_order_counter') || '1');
    let orderHistory = JSON.parse(localStorage.getItem('south_order_history') || '[]');

    function saveState() {
      localStorage.setItem('south_order_counter', orderCounter);
      localStorage.setItem('south_order_history', JSON.stringify(orderHistory));
      localStorage.setItem('south_current_cart', JSON.stringify(cart));
      localStorage.setItem('south_payment_method', selectedPayment);
      document.getElementById('order-number-display').innerText = 'Order #' + orderCounter;
    }

    function resetModalOptions() {
      selectedOptions = { 
        size: '8 oz',
        shots: 'Double Shot',
        milk: 'Full Fat', 
        sugar: 'Normal Sweetness',
        temp: 'Standard Temp/Ice'
      };

      document.querySelectorAll('#size-group .opt-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.startsWith('8 oz'));
      });
      document.querySelectorAll('#shots-group .opt-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.startsWith('Double Shot'));
      });
      document.querySelectorAll('#milk-group .opt-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.startsWith('Full Fat'));
      });
      document.querySelectorAll('#sugar-group .opt-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.startsWith('Normal'));
      });
      document.querySelectorAll('#temp-group .opt-btn').forEach(b => {
        b.classList.toggle('selected', b.innerText.startsWith('Standard'));
      });
    }

    function filterCategory(cat, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      
      const filtered = menuItems.filter(i => i.category === cat);
      filtered.forEach(item => {
        grid.innerHTML += `
          <div class="item-card" onclick="handleItemClick(${item.id})">
            <div class="item-title">${item.name}</div>
            <div class="item-price">${item.price.toFixed(3)} KD</div>
          </div>
        `;
      });
    }

    function handleItemClick(id) {
      const item = menuItems.find(i => i.id === id);
      if (item.customizable) {
        currentItemToAdd = item;
        resetModalOptions();
        document.getElementById('modal-item-title').innerText = item.name;
        document.getElementById('customizeModal').style.display = 'flex';
      } else {
        addToCart(item, '', 0);
      }
    }

    function selectOpt(btn, group, val) {
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedOptions[group] = val;
    }

    function selectPayment(method, btn) {
      selectedPayment = method;
      document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      saveState();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function confirmAddToCart() {
      let extra = 0;
      let notes = [];

      // Size charges
      if (selectedOptions.size.includes('12 oz')) extra += 0.250;
      if (selectedOptions.size.includes('16 oz')) extra += 0.500;
      if (selectedOptions.size !== '8 oz') notes.push(selectedOptions.size.split(' ')[0] + ' ' + selectedOptions.size.split(' ')[1]);

      // Shot charges
      if (selectedOptions.shots.includes('Extra Shot')) extra += 0.250;
      if (selectedOptions.shots !== 'Double Shot') notes.push(selectedOptions.shots.replace(' (+0.250 KD)', ''));

      // Milk charges
      if (selectedOptions.milk.includes('Almond') || selectedOptions.milk.includes('Oat') || selectedOptions.milk.includes('Coconut')) {
        extra += 0.250;
      }
      if (selectedOptions.milk !== 'Full Fat') notes.push(selectedOptions.milk.replace(' (+0.250 KD)', ''));

      // Sweetness level
      if (selectedOptions.sugar !== 'Normal Sweetness') notes.push(selectedOptions.sugar);

      // Temperature / Ice profile
      if (selectedOptions.temp !== 'Standard Temp/Ice') notes.push(selectedOptions.temp);

      addToCart(currentItemToAdd, notes.join(', '), extra);
      closeModal('customizeModal');
    }

    function addToCart(item, notes, extraCost) {
      const existing = cart.find(c => c.id === item.id && c.notes === notes);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({
          id: item.id,
          name: item.name,
          price: item.price + extraCost,
          notes: notes,
          qty: 1
        });
      }
      saveState();
      renderCart();
    }

    function updateQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveState();
      renderCart();
    }

    function clearCart() {
      cart = [];
      saveState();
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        container.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-header">
              <span>${item.name}</span>
              <span>${itemTotal.toFixed(3)} KD</span>
            </div>
            ${item.notes ? `<div class="cart-item-details">${item.notes}</div>` : ''}
            <div class="cart-item-actions">
              <span>${item.price.toFixed(3)} KD</span>
              <div>
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span style="margin: 0 8px;">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-total').innerText = total.toFixed(3) + ' KD';
    }

    function processCheckout() {
      if (cart.length === 0) return alert('Please add items to cart first!');
      
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const fullDateStr = `${dateStr}  ${timeStr}`;

      let total = 0;
      const receiptBody = document.getElementById('receipt-body');
      receiptBody.innerHTML = '';

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        receiptBody.innerHTML += `
          <div>
            <div class="receipt-row">
              <div class="col-qty">${item.qty}</div>
              <div class="col-item">${item.name}</div>
              <div class="col-price">${itemTotal.toFixed(3)}</div>
            </div>
            ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ''}
          </div>
        `;
      });

      const orderRecord = {
        id: orderCounter,
        timestamp: fullDateStr,
        items: JSON.parse(JSON.stringify(cart)),
        total: total,
        payment: selectedPayment,
        status: 'COMPLETED'
      };

      orderHistory.push(orderRecord);

      document.querySelectorAll('.print-date').forEach(el => el.innerText = fullDateStr);
      document.getElementById('receipt-order-id').innerText = 'ORDER #' + orderCounter;
      document.getElementById('receipt-payment-type').innerText = selectedPayment;
      document.getElementById('receipt-subtotal').innerText = total.toFixed(3);
      document.getElementById('receipt-total').innerText = 'KWD ' + total.toFixed(3);
      
      document.getElementById('receiptModal').style.display = 'flex';
      
      // Auto-triggers twin prints for receipt and kitchen ticket
      triggerSequentialPrint();
    }

    function triggerSequentialPrint() {
      let printCount = 0;

      function handleAfterPrint() {
        printCount++;
        if (printCount < 2) {
          setTimeout(() => {
            window.print();
          }, 300);
        } else {
          window.removeEventListener('afterprint', handleAfterPrint);
        }
      }

      window.addEventListener('afterprint', handleAfterPrint);
      window.print();
    }

    function closeReceipt() {
      document.getElementById('receiptModal').style.display = 'none';
      orderCounter++;
      cart = [];
      saveState();
      renderCart();
    }

    function openOrderHistory() {
      const container = document.getElementById('history-container');
      container.innerHTML = '';

      if (orderHistory.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No orders recorded yet.</p>';
      } else {
        [...orderHistory].reverse().forEach(order => {
          container.innerHTML += `
            <div class="history-card">
              <div>
                <strong>Order #${order.id}</strong> - ${order.total.toFixed(3)} KD (${order.payment})
                <br><span style="font-size: 11px; color: var(--text-muted);">${order.timestamp}</span>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <span class="status-tag ${order.status === 'COMPLETED' ? 'status-completed' : 'status-canceled'}">${order.status}</span>
                ${order.status === 'COMPLETED' ? `
                  <button class="action-btn-sm" onclick="editOrder(${order.id})">Edit</button>
                  <button class="action-btn-sm" style="background: var(--danger); border: none;" onclick="cancelOrder(${order.id})">Cancel/Refund</button>
                ` : ''}
              </div>
            </div>
          `;
        });
      }

      document.getElementById('historyModal').style.display = 'flex';
    }

    function cancelOrder(orderId) {
      const pin = prompt("Enter Manager PIN to cancel order #" + orderId + ":");
      if (pin !== MANAGER_PIN) return alert("Incorrect Manager PIN.");

      const target = orderHistory.find(o => o.id === orderId);
      if (target) {
        target.status = 'CANCELED';
        saveState();
        openOrderHistory();
        alert("Order #" + orderId + " has been canceled and marked as refunded.");
      }
    }

    function editOrder(orderId) {
      const pin = prompt("Enter Manager PIN to reopen and edit order #" + orderId + ":");
      if (pin !== MANAGER_PIN) return alert("Incorrect Manager PIN.");

      const targetIndex = orderHistory.findIndex(o => o.id === orderId);
      if (targetIndex !== -1) {
        cart = JSON.parse(JSON.stringify(orderHistory[targetIndex].items));
        selectedPayment = orderHistory[targetIndex].payment;
        orderHistory.splice(targetIndex, 1);
        saveState();
        renderCart();
        closeModal('historyModal');
        alert("Order #" + orderId + " loaded into cart for editing.");
      }
    }

    function openClosingReport() {
      const pin = prompt("Enter Manager PIN for Daily Closing Report:");
      if (pin !== MANAGER_PIN) return alert("Incorrect Manager PIN.");

      let totalSales = 0;
      let knetSales = 0;
      let cashSales = 0;
      let canceledTotal = 0;
      let completedCount = 0;
      let canceledCount = 0;

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const fullDateStr = `${dateStr}  ${timeStr}`;

      orderHistory.forEach(o => {
        if (o.status === 'COMPLETED') {
          totalSales += o.total;
          completedCount++;
          if (o.payment === 'K-NET') knetSales += o.total;
          if (o.payment === 'Cash') cashSales += o.total;
        } else if (o.status === 'CANCELED') {
          canceledTotal += o.total;
          canceledCount++;
        }
      });

      document.querySelectorAll('#closingReportModal .print-date').forEach(el => el.innerText = fullDateStr);

      document.getElementById('report-summary-body').innerHTML = `
        <div class="receipt-row">
          <span>Total Orders Processed:</span>
          <strong>${orderHistory.length}</strong>
        </div>
        <div class="receipt-row">
          <span>Completed Orders:</span>
          <strong>${completedCount}</strong>
        </div>
        <div class="receipt-row">
          <span>Canceled/Refunded Orders:</span>
          <strong>${canceledCount}</strong>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-row">
          <span>K-NET Total:</span>
          <strong>${knetSales.toFixed(3)} KWD</strong>
        </div>
        <div class="receipt-row">
          <span>Cash Total:</span>
          <strong>${cashSales.toFixed(3)} KWD</strong>
        </div>
        <div class="receipt-row">
          <span>Refunded Value:</span>
          <strong>${canceledTotal.toFixed(3)} KWD</strong>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-total-section">
          <div class="receipt-total-row" style="font-size: 13px; font-weight: 700;">
            <span>NET REVENUE</span>
            <span>KWD ${totalSales.toFixed(3)}</span>
          </div>
        </div>
      `;

      document.getElementById('closingReportModal').style.display = 'flex';
    }

    function resetShiftData() {
      const pin = prompt("Enter Manager PIN to CLEAR shift data and reset order count:");
      if (pin !== MANAGER_PIN) return alert("Incorrect PIN.");

      if (confirm("Are you sure you want to clear all order history for today?")) {
        orderCounter = 1;
        orderHistory = [];
        cart = [];
        saveState();
        renderCart();
        closeModal('closingReportModal');
        alert("Shift reset complete.");
      }
    }

    // App Initializer
    saveState();
    renderCart();
    if (selectedPayment === 'Cash') {
      document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('pay-cash').classList.add('selected');
    }
    const firstCatBtn = document.querySelector('.cat-btn');
    filterCategory('hot', firstCatBtn);
  </script>
</body>
</html>
