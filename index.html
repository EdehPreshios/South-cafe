<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUTH SPECIALTY COFFEE Menu</title>
  <style>
    :root {
      --outer-bg: #121418;        
      --frame-bg: #FAF8F5;        
      --card-bg: #F2EFE9;         
      --text-main: #1C1C1E;       
      --text-muted: #6E6E73;      
      --accent: #8A7B6C;          
      --border-color: #E2DDD5;    
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--outer-bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 12px;
    }

    .menu-container {
      max-width: 580px;
      margin: 0 auto;
      background-color: var(--frame-bg);
      border-radius: 20px;
      padding: 32px 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #2A2E35;
    }

    /* Circular Metallic Emblem Header */
    header {
      display: flex;
      justify-content: center;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .logo-badge-outer {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #D8D2C9; /* Outer limestone ring */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.1);
    }

    .logo-badge-inner {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      /* Brushed silver metal gradient */
      background: linear-gradient(135deg, #E8E4DF 0%, #C3BCB3 50%, #D5CFC8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border: 1px solid #B5AEA5;
      text-align: center;
      padding: 10px;
    }

    .logo-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #1C1C1E;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 6px;
    }

    .logo-subtitle {
      font-size: 8px;
      color: #3A3A3C;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Section Styles */
    .section {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .section-title .ar {
      font-size: 15px;
      direction: rtl;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-names {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-en {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-ar {
      font-size: 13px;
      color: var(--text-muted);
      direction: rtl;
      text-align: right;
    }

    .price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      margin-left: 12px;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="menu-container">
    <header>
      <div class="logo-badge-outer">
        <div class="logo-badge-inner">
          <div class="logo-title">SOUTH</div>
          <div class="logo-subtitle">SPECIALTY COFFEE</div>
        </div>
      </div>
    </header>

    <!-- Sections 1 through 4 remain below as before -->
